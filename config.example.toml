# ArcartX-Debug-MCP 配置文件示例
# 复制为 config.toml 后按需修改

[server]
mode = "stdio"  # "stdio" 或 "sse"
listen = "127.0.0.1:18900"  # SSE 模式监听地址

[workspace]
path = "D:\\path\\to\\your\\server"  # 指向服务端根目录（含 plugins/ArcartX-Suite/ui/）

[bridge]
url = "ws://127.0.0.1:18899"
token = "axs-debug-local"
auto_connect = false
