[package]
name = "arcartx-debug-mcp"
version = "0.1.0"
edition = "2021"
description = "ArcartXSuite 专属 MCP Server，提供离线分析与在线调试工具"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
yaml-rust2 = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
axum = "0.7"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
regex = "1"
async-stream = "0.3"
tokio-stream = "0.1"

[profile.release]
opt-level = 2
